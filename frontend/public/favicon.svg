<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#bg)" />
  <!-- Indian Rupee symbol ₹ rendered as paths for max compatibility -->
  <!-- Top horizontal bar -->
  <rect x="18" y="15" width="28" height="4" rx="2" fill="white"/>
  <!-- Second horizontal bar -->
  <rect x="18" y="23" width="22" height="4" rx="2" fill="white"/>
  <!-- Left vertical stem -->
  <rect x="18" y="15" width="4" height="34" rx="2" fill="white"/>
  <!-- Diagonal line going bottom-right (the diagonal stroke of ₹) -->
  <line x1="22" y1="27" x2="44" y2="49" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>