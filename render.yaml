services:
  - type: web
    name: financeflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure 256-bit secret
      - key: CLIENT_URL
        value: https://financeflow-six-gilt.vercel.app
